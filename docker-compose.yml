services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app   # optional: live-reload on code changes
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    env_file:
      - ./frontend/.env

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - VITE_API_URL=https://open-atlas-hackathon.onrender.com/

    depends_on:
      - backend
